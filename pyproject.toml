[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warpy-kernels"
version = "0.1.0"
description = "CuTE Kernels for Local LLMs"
requires-python = ">=3.12"
dependencies = [
    "nvidia-cutlass-dsl==4.8.1",
    "torch>=2.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["warpy_kernels"]

[tool.hatch.build.targets.sdist]
include = ["warpy_kernels"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyflakes>=4.1.0",
]
